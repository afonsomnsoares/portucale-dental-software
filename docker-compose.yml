services:
  postgres:
    image: postgres:17-alpine
    container_name: portucale-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: portucale_dental
      # Read by scripts/docker-init-app-role-password.sh below — only used on
      # first container start (empty data volume), same as every other
      # /docker-entrypoint-initdb.d/ script.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/docker-init-app-role-password.sh:/docker-entrypoint-initdb.d/02-app-role-password.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # O initdb do postgres acima aplica APENAS scripts/schema.sql, que define 32 das 61
  # tabelas — patients, patient_tasks, inventory_items, suppliers, shift_handoffs e mais
  # duas dezenas nascem das migrações em scripts/migrations/. Sem este serviço,
  # `docker compose up -d` levantava uma app que arranca, serve tráfego e falha em quase
  # todas as páginas por tabelas inexistentes (lib/db.ts's warnSchemaGap avisa no log, o
  # que é tarde). Corre uma vez até ao fim e sai; app e jobs esperam por esse fim.
  #
  # Usa deliberadamente a ligação admin, tal como o serviço `jobs`: aplicar DDL é
  # exatamente o que o papel restrito portucale_app não pode nem deve fazer.
  #
  # scripts/migrate.ts é seguro de repetir — envolve tudo numa transação única com
  # ROLLBACK em erro, e salta as migrações já registadas em schema_migrations, por isso
  # um `docker compose up` numa base de dados já migrada é um no-op.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: portucale-migrate
    # Um passo de arranque, não um serviço: sem isto o Compose reiniciava-o em ciclo
    # depois de terminar com sucesso.
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/portucale_dental
    command: ['node', '--import', 'tsx', 'scripts/migrate.ts']
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: portucale-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@portucale.dental
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD}
    ports:
      - '127.0.0.1:5050:80'
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Needed at BUILD time, not just runtime: next.config.mjs bakes the R2 origin
      # into the Content-Security-Policy, and a value passed only through
      # `environment:` below arrives too late to appear in it. See the Dockerfile.
      args:
        R2_ENDPOINT: ${R2_ENDPOINT:-}
        R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
    container_name: portucale-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Admin connection — unused by the app itself once APP_DATABASE_URL
      # below is set (lib/db.ts prefers it), kept here only so this service
      # still works unmodified if that var is ever removed.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/portucale_dental
      # Restricted, RLS-bound connection — see scripts/migrations/011_row_level_security.sql
      # and .env's APP_DATABASE_URL comment for why this is what actually makes
      # RLS enforce anything. Deliberately not set on the `jobs` service below,
      # which needs the unrestricted admin connection instead.
      APP_DATABASE_URL: postgresql://portucale_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres:5432/portucale_dental
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      NODE_ENV: production
      # Optional — leaving these unset just makes the SMS send step and the AI
      # report insight degrade gracefully (see lib/jobsRunner.ts and
      # app/api/reports/insight/route.ts), not error.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # File storage — also passed as build args above, because the two public
      # origins are part of the CSP. The keys are runtime-only, as they should be.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      # Não basta o Postgres estar de pé: tem de estar migrado. Ver o serviço `migrate`.
      migrate:
        condition: service_completed_successfully

  # Unattended counterpart to the admin "Run Jobs" action: periodically runs
  # scripts/run-jobs.ts (see that file / lib/jobsRunner.ts) for every active tenant —
  # appointment reminders, no-show risk scoring + proactive outreach, patient lifecycle
  # reactivation outreach, sending queued SMS notifications, waitlist offer expiry,
  # upload retention, nightly summary, revenue recovery snapshot. Talks to Postgres
  # directly (via lib/db.ts) rather than calling the app's HTTP API, so it needs no
  # session/CSRF credentials of its own — same trust boundary as scripts/migrate.ts.
  jobs:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: portucale-jobs
    restart: unless-stopped
    environment:
      # Intentionally the admin connection, not APP_DATABASE_URL — this
      # process reads across every tenant with no per-request session to
      # scope it, so it's exempt from Row-Level Security the same way
      # scripts/migrate.ts is (see that migration's header comment).
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/portucale_dental
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      UPLOAD_RETENTION_DAYS: ${UPLOAD_RETENTION_DAYS:-90}
      JOB_INTERVAL_SECONDS: ${JOB_INTERVAL_SECONDS:-900}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          node --import tsx scripts/run-jobs.ts || true
          sleep "$$JOB_INTERVAL_SECONDS"
        done
    depends_on:
      postgres:
        condition: service_healthy
      # Pela mesma razão do serviço `app`: o pipeline de jobs toca em job_runs,
      # patient_tasks, inventory_* e notifications, nenhuma delas criada por schema.sql.
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
