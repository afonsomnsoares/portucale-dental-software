# ─── Tetos de memória ────────────────────────────────────────────────────────
# Cada serviço tem um `mem_limit`, e a razão é concreta: sem teto, um `docker
# compose up` nesta máquina (5,8 GB) leva o sistema inteiro à frente — o
# oom-killer do kernel escolhe a vítima, e a vítima costuma ser outra coisa
# qualquer que estava a trabalhar.
#
# Com teto, quem passa dos limites é o contentor que se portou mal, e só esse.
# Os valores são para desenvolvimento; num servidor dedicado sobem.
services:
  postgres:
    mem_limit: 512m
    image: postgres:17-alpine
    container_name: portucale-db
    restart: unless-stopped
    environment:
      # Fuso do servidor de base de dados. Importa porque há SQL que lê a hora de
      # parede — EXTRACT(HOUR FROM NOW()) em lib/jobsRunner.ts decide a que horas
      # saem os lembretes de checklist. Em UTC saíam uma hora fora durante a hora
      # de verão, sete meses por ano.
      TZ: ${TZ:-Europe/Lisbon}
      POSTGRES_USER: postgres
      # Sem omissão, ao contrário do resto deste ficheiro: esta é a credencial do
      # SUPERUSER, e é a ligação que aplica DDL e corre os jobs. Um valor por defeito
      # ('postgres') é o que ninguém repara que ficou em produção.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: portucale_dental
      # Read by scripts/docker-init-app-role-password.sh below — only used on
      # first container start (empty data volume), same as every other
      # /docker-entrypoint-initdb.d/ script.
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./scripts/docker-init-app-role-password.sh:/docker-entrypoint-initdb.d/02-app-role-password.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # O initdb do postgres acima aplica APENAS scripts/schema.sql, que define 32 das 61
  # tabelas — patients, patient_tasks, inventory_items, suppliers, shift_handoffs e mais
  # duas dezenas nascem das migrações em scripts/migrations/. Sem este serviço,
  # `docker compose up -d` levantava uma app que arranca, serve tráfego e falha em quase
  # todas as páginas por tabelas inexistentes (lib/db.ts's warnSchemaGap avisa no log, o
  # que é tarde). Corre uma vez até ao fim e sai; app e jobs esperam por esse fim.
  #
  # Usa deliberadamente a ligação admin, tal como o serviço `jobs`: aplicar DDL é
  # exatamente o que o papel restrito portucale_app não pode nem deve fazer.
  #
  # scripts/migrate.ts é seguro de repetir — envolve tudo numa transação única com
  # ROLLBACK em erro, e salta as migrações já registadas em schema_migrations, por isso
  # um `docker compose up` numa base de dados já migrada é um no-op.
  migrate:
    mem_limit: 512m
    build:
      context: .
      dockerfile: Dockerfile
      # Ver a stage `worker` no Dockerfile: é a `builder` com um utilizador sem
      # privilégios por cima. Apontar aqui para `builder` era correr isto como root.
      target: worker
    container_name: portucale-migrate
    # Um passo de arranque, não um serviço: sem isto o Compose reiniciava-o em ciclo
    # depois de terminar com sucesso.
    restart: 'no'
    environment:
      # Sem isto o contentor corre em UTC, enquanto `appt_date` e `start_time` são
      # hora de parede de Lisboa. Os turnos (isOnShift, shiftHandoff, taskRouting)
      # comparam com getHours()/getDay() locais: em UTC, um turno das 09:00 às 18:00
      # avaliava uma hora deslocado durante toda a hora de verão.
      TZ: ${TZ:-Europe/Lisbon}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/portucale_dental
    command: ['node', '--import', 'tsx', 'scripts/migrate.ts']
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    mem_limit: 512m
    image: dpage/pgadmin4:9
    container_name: portucale-pgadmin
    # Uma consola de administração da base de dados não arranca sozinha em todos os
    # ambientes. Com o perfil, só sobe a pedido — `docker compose --profile tools up`.
    # Continua ligada a 127.0.0.1 e com password obrigatória; isto tira-lhe o resto.
    profiles: ['tools']
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@portucale.dental
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD}
    ports:
      - '127.0.0.1:5050:80'
    depends_on:
      postgres:
        condition: service_healthy

  app:
    mem_limit: 1g
    build:
      context: .
      dockerfile: Dockerfile
      # Needed at BUILD time, not just runtime: next.config.mjs bakes the R2 origin
      # into the Content-Security-Policy, and a value passed only through
      # `environment:` below arrives too late to appear in it. See the Dockerfile.
      args:
        R2_ENDPOINT: ${R2_ENDPOINT:-}
        R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
        # Aparece em Definições › Configuração, e é o que responde a «o que está
        # em produção agora». O Compose não corre `git`, por isso quem constrói é
        # que o traz:
        #   BUILD_COMMIT=$(git rev-parse --short HEAD) docker compose build app
        # Sem ele fica vazio e a página di-lo, em vez de inventar um valor.
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    container_name: portucale-app
    restart: unless-stopped
    # ─── Já não se publica na rede ──────────────────────────────────────────
    # Era '3000:3000', ou seja, a app exposta em claro em todas as interfaces. O
    # código põe HSTS e cookies `secure` (next.config.mjs e app/api/auth/login),
    # e um cookie `secure` nem chega a ser guardado pelo browser sobre HTTP — em
    # HTTP a app não ficava insegura, ficava impossível de usar, e o login falhava
    # sem dizer porquê.
    #
    # Quem termina TLS agora é o serviço `caddy` abaixo, que alcança este pela rede
    # interna do Compose (http://app:3000). O 127.0.0.1 fica só para depuração na
    # própria máquina.
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      # Os uploads sobrevivem ao redeploy. Sem R2 configurado, lib/uploads.ts grava
      # em public/uploads DENTRO do contentor — e a imagem traz o public/ assado, por
      # isso cada `docker compose up --build` apagava os anexos das notas clínicas e
      # os ficheiros do portal do doente, deixando para trás as linhas de `uploads`
      # a apontar para ficheiros que já não existiam. Ver o mkdir no Dockerfile, que
      # é o que garante que este volume nasce com dono `nextjs` e não root.
      # O sítio novo, fora da árvore servida estaticamente.
      - uploads_data:/app/data/uploads
      # O antigo, para as instalações que já lá tinham ficheiros. Serve-os pela rota
      # até a retenção os apagar; pode sair daqui quando o volume estiver vazio.
      - uploads:/app/public/uploads
    environment:
      # Sem isto o contentor corre em UTC, enquanto `appt_date` e `start_time` são
      # hora de parede de Lisboa. Os turnos (isOnShift, shiftHandoff, taskRouting)
      # comparam com getHours()/getDay() locais: em UTC, um turno das 09:00 às 18:00
      # avaliava uma hora deslocado durante toda a hora de verão.
      TZ: ${TZ:-Europe/Lisbon}
      # Admin connection — unused by the app itself once APP_DATABASE_URL
      # below is set (lib/db.ts prefers it), kept here only so this service
      # still works unmodified if that var is ever removed.
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/portucale_dental
      # Restricted, RLS-bound connection — see scripts/migrations/011_row_level_security.sql
      # and .env's APP_DATABASE_URL comment for why this is what actually makes
      # RLS enforce anything. Deliberately not set on the `jobs` service below,
      # which needs the unrestricted admin connection instead.
      APP_DATABASE_URL: postgresql://portucale_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@postgres:5432/portucale_dental
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      NODE_ENV: production
      # De que entrada do X-Forwarded-For sai o IP do cliente (lib/rateLimit.ts).
      # Fica a 0 por omissão porque este ficheiro publica a app diretamente em
      # 3000:3000, sem nada à frente — e nesse caso o cabeçalho é escrito por quem
      # chama. Pôr um proxy à frente sem acertar isto aqui deixa os limites por IP
      # a contar um valor forjado; ver .env.example.
      # Passou de 0 a 1: há agora exatamente um proxy de confiança à frente (o
      # `caddy` abaixo), e é a entrada que ele escreve no X-Forwarded-For que vale.
      # Com 0, a app confiaria no cabeçalho como o cliente o mandasse e os limites
      # por IP contavam um valor forjado. Atrás de Cloudflare + caddy seriam 2 —
      # contar a mais é pior do que contar a menos (ver .env.example).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # O endereço público, para a validação da assinatura dos webhooks da Twilio: ela
      # assina o URL a que fez o pedido, e aqui dentro o Next vê `http://app:3000`.
      # Deriva do mesmo APP_DOMAIN que o Caddy usa, para os dois não poderem divergir.
      # Ver lib/twilioSignature.ts e .env.example.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${APP_DOMAIN:-localhost}}
      # Optional — leaving these unset just makes the SMS send step and the AI
      # report insight degrade gracefully (see lib/jobsRunner.ts and
      # app/api/reports/insight/route.ts), not error.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # File storage — also passed as build args above, because the two public
      # origins are part of the CSP. The keys are runtime-only, as they should be.
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      # Não basta o Postgres estar de pé: tem de estar migrado. Ver o serviço `migrate`.
      migrate:
        condition: service_completed_successfully
    # Sem isto o `app` conta como pronto assim que o contentor arranca, e o Caddy
    # (que só dizia `depends_on: - app`) começava a encaminhar para um Next.js ainda
    # a subir — 502 a cada deploy, durante o arranque inteiro.
    #
    # Um 401 CONTA COMO SAUDÁVEL, de propósito: /api/platform/health exige
    # super-admin, por isso uma resposta 401 prova que o Next arrancou, que o
    # `withRoute` correu e que a autenticação decidiu — que é tudo o que o Caddy
    # precisa de saber antes de encaminhar. Só 5xx (ou nenhuma resposta) é que é
    # doença. Não se mete aqui credencial nenhuma por causa disto.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/platform/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Unattended counterpart to the admin "Run Jobs" action: periodically runs
  # scripts/run-jobs.ts (see that file / lib/jobsRunner.ts) for every active tenant —
  # appointment reminders, no-show risk scoring + proactive outreach, patient lifecycle
  # reactivation outreach, sending queued SMS notifications, waitlist offer expiry,
  # upload retention, nightly summary, revenue recovery snapshot. Talks to Postgres
  # directly (via lib/db.ts) rather than calling the app's HTTP API, so it needs no
  # session/CSRF credentials of its own — same trust boundary as scripts/migrate.ts.
  jobs:
    mem_limit: 512m
    build:
      context: .
      dockerfile: Dockerfile
      # Ver a stage `worker` no Dockerfile: é a `builder` com um utilizador sem
      # privilégios por cima. Apontar aqui para `builder` era correr isto como root.
      target: worker
    container_name: portucale-jobs
    restart: unless-stopped
    volumes:
      # O MESMO volume do serviço `app`, e não por simetria: o cleanupUploads de
      # lib/jobsRunner.ts (linha ~675) apaga ficheiros expirados de public/uploads
      # pelo disco. Sem esta montagem, este contentor varria um diretório vazio que
      # é só dele — a retenção de uploads reportava sucesso todos os dias sem nunca
      # apagar nada, e os ficheiros de verdade ficavam no volume do `app` para sempre.
      # O sítio novo, fora da árvore servida estaticamente.
      - uploads_data:/app/data/uploads
      # O antigo, para as instalações que já lá tinham ficheiros. Serve-os pela rota
      # até a retenção os apagar; pode sair daqui quando o volume estiver vazio.
      - uploads:/app/public/uploads
    environment:
      # Sem isto o contentor corre em UTC, enquanto `appt_date` e `start_time` são
      # hora de parede de Lisboa. Os turnos (isOnShift, shiftHandoff, taskRouting)
      # comparam com getHours()/getDay() locais: em UTC, um turno das 09:00 às 18:00
      # avaliava uma hora deslocado durante toda a hora de verão.
      TZ: ${TZ:-Europe/Lisbon}
      # Intentionally the admin connection, not APP_DATABASE_URL — this
      # process reads across every tenant with no per-request session to
      # scope it, so it's exempt from Row-Level Security the same way
      # scripts/migrate.ts is (see that migration's header comment).
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/portucale_dental
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      # Sem isto a camada de agentes está desligada em Docker, e desligada em silêncio.
      # Os 15 módulos de lib/agents/ correm TODOS dentro deste pipeline — nenhum é
      # chamado a partir de uma rota HTTP — por isso a chave estar só no serviço `app`
      # acima não os alcançava. E o callAgentTool trata a chave em falta com elegância
      # (regista status:'unconfigured' e segue), que é precisamente o que escondia o
      # problema: não havia erro nenhum, havia um painel de agentes permanentemente
      # vazio, indistinguível de «os agentes correram e não encontraram nada».
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      UPLOAD_RETENTION_DAYS: ${UPLOAD_RETENTION_DAYS:-90}
      JOB_INTERVAL_SECONDS: ${JOB_INTERVAL_SECONDS:-900}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          node --import tsx scripts/run-jobs.ts || true
          sleep "$$JOB_INTERVAL_SECONDS"
        done
    depends_on:
      postgres:
        condition: service_healthy
      # Pela mesma razão do serviço `app`: o pipeline de jobs toca em job_runs,
      # patient_tasks, inventory_* e notifications, nenhuma delas criada por schema.sql.
      migrate:
        condition: service_completed_successfully

  # ─── Terminação TLS ─────────────────────────────────────────────────────────
  # O README dizia, e dizia bem, que TLS "não é responsabilidade do código". Só que
  # também não estava a ser responsabilidade de ninguém: o compose publicava a app em
  # claro e o produto guarda dados de saúde. Fica aqui, ao lado do resto, para que
  # subir o produto e subir o TLS sejam o mesmo comando.
  #
  # Caddy e não nginx por uma razão só: os certificados. Renova sozinho via ACME sem
  # cron, sem certbot e sem um ficheiro de configuração de cinquenta linhas — e um
  # certificado que expira num domingo é o modo de falha real deste tipo de serviço.
  #
  # APP_DOMAIN por omissão é `localhost`, e aí o Caddy emite um certificado local
  # assinado por ele próprio: a stack sobe em HTTPS numa máquina de desenvolvimento
  # sem pedir um domínio a ninguém. Com um domínio a sério, o mesmo ficheiro passa a
  # ir buscar um certificado Let's Encrypt sem mais nenhuma alteração.
  caddy:
    mem_limit: 128m
    image: caddy:2-alpine
    container_name: portucale-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      # Só usado quando APP_DOMAIN é um domínio real. A Let's Encrypt manda avisos de
      # expiração para aqui, que é o único canal que resta quando a renovação falha.
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Os certificados TÊM de sobreviver ao restart. Sem isto, cada reinício pedia
      # certificados novos e a Let's Encrypt aplica limites por semana e por domínio —
      # algumas reinicializações num dia mau e o domínio fica sem poder emitir.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      # `- app` esperava só pelo arranque do contentor, não por ele servir. Ver o
      # healthcheck do serviço `app`.
      app:
        condition: service_healthy

  # ─── Cópias de segurança ────────────────────────────────────────────────────
  # Não existia nada. Nenhum pg_dump, nenhum procedimento, nada fora do volume
  # `pgdata` — que vive no mesmo disco que tudo o resto. Para um produto que guarda
  # processos de doentes isso é a falha mais grave possível: irreversível, e a
  # disponibilidade dos dados é obrigação do RGPD (art. 32.º), não uma cortesia.
  #
  # Imagem `postgres:17-alpine` e não a do projeto: é aqui que vive o pg_dump, e na
  # MESMA versão maior do servidor acima — um pg_dump mais antigo do que o servidor
  # recusa-se a correr, e é o género de coisa que só se descobre quando se precisa.
  #
  # Escreve para ${BACKUP_DIR:-./backups}, um bind mount e não um volume nomeado, de
  # propósito: uma cópia de segurança tem de poder sair desta máquina, e para isso o
  # rsync/rclone de quem administra precisa de a ver no sistema de ficheiros. Aponta
  # isto a um disco montado ou a uma pasta sincronizada para fora.
  #
  # ISTO NÃO É AINDA OFFSITE. Cópias no mesmo servidor protegem de "apaguei a tabela
  # errada", não de o servidor se perder. Ver o cabeçalho de scripts/backup.sh.
  backup:
    mem_limit: 256m
    image: postgres:17-alpine
    container_name: portucale-backup
    restart: unless-stopped
    environment:
      # Sem isto o contentor corre em UTC, enquanto `appt_date` e `start_time` são
      # hora de parede de Lisboa. Os turnos (isOnShift, shiftHandoff, taskRouting)
      # comparam com getHours()/getDay() locais: em UTC, um turno das 09:00 às 18:00
      # avaliava uma hora deslocado durante toda a hora de verão.
      TZ: ${TZ:-Europe/Lisbon}
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: portucale_dental
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ['sh', '-c', 'while true; do sh /usr/local/bin/backup.sh || true; sleep "$$BACKUP_INTERVAL_SECONDS"; done']
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Vigia do pipeline de jobs ──────────────────────────────────────────────
  # lib/platformStats.ts já calcula `staleJobs` e mostra-o em Saúde do Sistema. O
  # problema é que é por CONSULTA: alguém tem de abrir a página. O serviço `jobs`
  # acima é um `while true; sleep`, e se morrer morre calado — os lembretes de
  # consulta e a fila de SMS param, e a clínica descobre-o pelos doentes que não
  # apareceram.
  #
  # Processo à parte do `jobs` de propósito, e esse é o ponto todo: um vigia que
  # corresse dentro do ciclo que vigia morria com ele.
  watchdog:
    mem_limit: 256m
    build:
      context: .
      dockerfile: Dockerfile
      # Ver a stage `worker` no Dockerfile: é a `builder` com um utilizador sem
      # privilégios por cima. Apontar aqui para `builder` era correr isto como root.
      target: worker
    container_name: portucale-watchdog
    restart: unless-stopped
    environment:
      # Sem isto o contentor corre em UTC, enquanto `appt_date` e `start_time` são
      # hora de parede de Lisboa. Os turnos (isOnShift, shiftHandoff, taskRouting)
      # comparam com getHours()/getDay() locais: em UTC, um turno das 09:00 às 18:00
      # avaliava uma hora deslocado durante toda a hora de verão.
      TZ: ${TZ:-Europe/Lisbon}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/portucale_dental
      # Quanto tempo sem uma passagem completa conta como avaria. Por omissão 4x o
      # JOB_INTERVAL_SECONDS do serviço `jobs` (900s), para uma passagem lenta ou um
      # restart não dispararem nada.
      JOBS_STALE_AFTER_SECONDS: ${JOBS_STALE_AFTER_SECONDS:-3600}
      WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-900}
      # Opcional. Sem isto o vigia só grita no log do contentor (que é melhor do que
      # o silêncio de hoje, mas continua a precisar de alguém a olhar). Com um número
      # de operações aqui, manda SMS por Twilio — é o número de QUEM ADMINISTRA, não
      # de um doente, e por isso não cai na regra do PRODUCT.md sobre o que sai da
      # clínica para fora.
      OPS_ALERT_PHONE: ${OPS_ALERT_PHONE:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          node --import tsx scripts/check-jobs-fresh.ts || true
          sleep "$$WATCHDOG_INTERVAL_SECONDS"
        done
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads_data:
  uploads:
  caddy_data:
  caddy_config:
